events {
    worker_connections 1024;
}

http {
    client_max_body_size 500M;
    
    # DNS resolver для динамического резолвинга имен контейнеров
    # Используем DNS сервер из /etc/resolv.conf (обычно это Docker/Podman DNS)
    # valid=30s означает, что DNS записи кэшируются на 30 секунд для ускорения
    # ipv6=off отключает IPv6 для ускорения резолвинга
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Кэш для thumbnail изображений
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=thumbnail_cache:10m max_size=100m inactive=1h use_temp_path=off;

    # Upstream для video-service (быстрее чем переменные с DNS резолвингом)
    # Используем upstream для предварительного резолвинга DNS при старте
    upstream video_service {
        server video-service:3001;
        keepalive 32;
    }
    
    upstream auth_service {
        server auth-service:3000;
        keepalive 32;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=video_limit:10m rate=5r/s;

    server {
        listen 80;
        server_name _;

        # CORS не нужен для same origin запросов (веб через API Gateway)
        # Если понадобится для внешних клиентов (iOS), можно добавить в конкретных location блоках

        # Auth service routes
        location /api/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;

            # Используем upstream для быстрого подключения
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Keepalive для переиспользования соединений
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # JWT validation (можно добавить)
            # auth_request /validate;
        }

        # Search service routes
        location /api/search {
            limit_req zone=video_limit burst=10 nodelay;

            # Используем upstream для быстрого подключения (DNS резолвится при старте)
            proxy_pass http://video_service/api/search;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            
            # Агрессивные таймауты для быстрого ответа
            proxy_connect_timeout 1s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;
            
            # Отключаем буферизацию для быстрого ответа
            proxy_buffering off;
            
            # Keepalive для переиспользования соединений
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Thumbnail endpoint - кэшируем для ускорения
        location ~ ^/api/videos/[^/]+/thumbnail$ {
            limit_req zone=video_limit burst=10 nodelay;

            set $backend "http://video-service:3001";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            
            # Кэширование thumbnail для ускорения
            proxy_cache thumbnail_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_valid 404 5m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Video streaming endpoint - без кэширования
        location /api/videos/ {
            limit_req zone=video_limit burst=10 nodelay;

            set $backend "http://video-service:3001";
            # Важно: не добавляем trailing slash, чтобы сохранить полный путь
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            # Критически важно: передаем Range заголовок для поддержки стриминга
            proxy_set_header Range $http_range;

            client_body_timeout 300s;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            
            # Не кэшируем видео для стриминга
            proxy_cache off;
            proxy_no_cache 1;
        }

        # Photos and Music endpoints
        location /api/photos/ {
            limit_req zone=video_limit burst=10 nodelay;

            set $backend "http://video-service:3001";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;

            client_body_timeout 300s;
            client_max_body_size 100M;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        location /api/music/ {
            limit_req zone=video_limit burst=10 nodelay;

            set $backend "http://video-service:3001";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;

            client_body_timeout 300s;
            client_max_body_size 500M;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # Health checks (most specific first)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # JWT validation endpoint (опционально)
        location = /validate {
            internal;
            set $backend "http://auth-service:3000";
            proxy_pass $backend/api/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # Video Service BFF (GraphQL)
        # Same origin через API Gateway - CORS не нужен
        location /graphql/video {
            set $backend "http://video-service-bff:3002";
            proxy_pass $backend/graphql;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Auth Service BFF (GraphQL)
        # Same origin через API Gateway - CORS не нужен
        location /graphql/auth {
            set $backend "http://auth-service-bff:3003";
            proxy_pass $backend/graphql;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Video Service SSR (Next.js) - must be last to catch all other routes
        location / {
            set $backend "http://video-service-ssr:3004";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Next.js specific
            proxy_buffering off;
            proxy_cache off;
        }
    }
}