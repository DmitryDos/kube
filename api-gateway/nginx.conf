events {
    worker_connections 1024;
}

http {
    client_max_body_size 500M;
    
    upstream auth_service {
        server auth-service:3000;
    }

    upstream video_service {
        server video-service:3001;
    }

    upstream video_service_bff {
        server video-service-bff:3002;
    }

    upstream auth_service_bff {
        server auth-service-bff:3003;
    }

    upstream video_service_ssr {
        server video-service-ssr:3004;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=video_limit:10m rate=5r/s;

    server {
        listen 80;
        server_name _;

        # CORS для iOS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Range, Content-Length, Accept-Ranges' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Auth service routes
        location /api/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;

            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # JWT validation (можно добавить)
            # auth_request /validate;
        }

        # Search service routes
        location /api/search {
            limit_req zone=video_limit burst=10 nodelay;

            proxy_pass http://video_service/api/search;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/videos/ {
            limit_req zone=video_limit burst=10 nodelay;

            proxy_pass http://video_service/api/videos/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            # Критически важно: передаем Range заголовок для поддержки стриминга
            proxy_set_header Range $http_range;

            client_body_timeout 300s;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            
            # Не кэшируем видео для стриминга
            proxy_cache off;
            proxy_no_cache 1;
        }

        # Health checks (most specific first)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # JWT validation endpoint (опционально)
        location = /validate {
            internal;
            proxy_pass http://auth_service/api/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # Video Service BFF (GraphQL)
        location /graphql/video {
            proxy_pass http://video_service_bff/graphql;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Auth Service BFF (GraphQL)
        location /graphql/auth {
            proxy_pass http://auth_service_bff/graphql;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Video Service SSR (Next.js) - must be last to catch all other routes
        location / {
            proxy_pass http://video_service_ssr;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Next.js specific
            proxy_buffering off;
            proxy_cache off;
        }
    }
}