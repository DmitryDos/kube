services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:80"
    depends_on:
      auth-service:
        condition: service_started
      video-service:
        condition: service_started

  postgres:
    image: postgres:15
    container_name: postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-video_platform}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d video_platform -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-video_platform}
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-here}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password_123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  video-service:
    build: ./video-service
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-video_platform}
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-here}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      MINIO_BUCKET: videos
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - video_temp:/app/temp
    restart: on-failure

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password_123}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password_123}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  video-service-bff:
    build:
      context: ./frontend
      dockerfile: ./services/video-service-bff/Dockerfile
    container_name: video-service-bff
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api-gateway:80}
      PORT: 3002
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3004}
    depends_on:
      - api-gateway
    restart: on-failure

  auth-service-bff:
    build:
      context: ./frontend
      dockerfile: ./services/auth-service-bff/Dockerfile
    container_name: auth-service-bff
    ports:
      - "3003:3003"
    env_file:
      - .env
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api-gateway:80}
      PORT: 3003
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3004}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      - api-gateway
    restart: on-failure

  video-service-ssr:
    build:
      context: ./frontend
      dockerfile: ./services/video-service-ssr/Dockerfile
    container_name: video-service-ssr
    ports:
      - "3004:3004"
    env_file:
      - .env
    environment:
      VIDEO_BFF_URL: http://video-service-bff:3002
      AUTH_BFF_URL: http://auth-service-bff:3003
      NEXT_PUBLIC_API_BASE_URL: http://51.250.34.223:8080
      NODE_ENV: production
    depends_on:
      - video-service-bff
      - auth-service-bff
    restart: on-failure

volumes:
  postgres_data:
  minio_data:
  video_uploads:
  video_temp: